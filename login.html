<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Patient Login & Register - MediCare Pulse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">
        <div class="brand-icon">✚</div>
        <div><span>MediCare</span><span style="color: var(--primary);">Pulse</span></div>
      </a>
      <ul class="nav-links">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="doctors.html" class="nav-link">Doctors</a></li>
      </ul>
      <div class="nav-actions">
        <a href="index.html" class="btn btn-secondary btn-sm">Back to Home</a>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="container">
      <div class="auth-container">
        <!-- Tabs -->
        <div class="auth-tabs">
          <div class="auth-tab active" id="tab-login">Sign In</div>
          <div class="auth-tab" id="tab-register">Register Patient</div>
        </div>

        <div class="auth-body">
          <!-- Dynamic Alert Message -->
          <div id="auth-alert" style="display: none; padding: 0.85rem 1rem; border-radius: var(--radius-md); font-size: 0.875rem; margin-bottom: 1.25rem;"></div>

          <!-- Login Form -->
          <form id="form-login">
            <div class="form-group">
              <label class="form-label" for="login-email">Email Address</label>
              <input type="email" id="login-email" class="form-control" placeholder="patient@example.com" required />
            </div>

            <div class="form-group">
              <label class="form-label" for="login-password">Password</label>
              <input type="password" id="login-password" class="form-control" placeholder="••••••••••••" required />
            </div>

            <button type="submit" class="btn btn-primary" id="btn-login-submit" style="width: 100%; margin-top: 0.75rem;">
              Sign In to Patient Portal
            </button>
          </form>

          <!-- Register Form -->
          <form id="form-register" style="display: none;">
            <div class="form-group">
              <label class="form-label" for="reg-name">Full Name</label>
              <input type="text" id="reg-name" class="form-control" placeholder="Jane Cooper" required />
            </div>

            <div class="form-group">
              <label class="form-label" for="reg-email">Email Address</label>
              <input type="email" id="reg-email" class="form-control" placeholder="jane@example.com" required />
            </div>

            <div class="form-group">
              <label class="form-label" for="reg-password">Password (min 6 characters)</label>
              <input type="password" id="reg-password" class="form-control" placeholder="••••••••••••" minlength="6" required />
            </div>

            <button type="submit" class="btn btn-primary" id="btn-register-submit" style="width: 100%; margin-top: 0.75rem;">
              Create Free Account & Sign In
            </button>
          </form>

          <div style="margin-top: 1.5rem; text-align: center; font-size: 0.85rem; color: var(--text-muted);">
            Are you an administrator? <a href="admin.html" style="color: var(--primary); font-weight: 700;">Open Admin Console &rarr;</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <div><strong>✚ MediCarePulse</strong> — Certified Doctor Scheduling Platform</div>
      <div>&copy; 2026 MediCare Pulse Health Systems. All rights reserved.</div>
    </div>
  </footer>

  <!-- Firebase Auth Logic -->
  <script type="module">
    import { auth, db } from './js/firebase-config.js';
    import { 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword, 
      updateProfile 
    } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
    import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    const tabLogin = document.getElementById('tab-login');
    const tabRegister = document.getElementById('tab-register');
    const formLogin = document.getElementById('form-login');
    const formRegister = document.getElementById('form-register');
    const alertBox = document.getElementById('auth-alert');

    function showAlert(message, isError = true) {
      alertBox.textContent = message;
      alertBox.style.display = 'block';
      alertBox.style.backgroundColor = isError ? 'var(--status-cancelled-bg)' : 'var(--status-confirmed-bg)';
      alertBox.style.color = isError ? 'var(--status-cancelled)' : 'var(--status-confirmed)';
      alertBox.style.border = `1px solid ${isError ? '#fecaca' : '#a7f3d0'}`;
    }

    tabLogin.addEventListener('click', () => {
      tabLogin.classList.add('active');
      tabRegister.classList.remove('active');
      formLogin.style.display = 'block';
      formRegister.style.display = 'none';
      alertBox.style.display = 'none';
    });

    tabRegister.addEventListener('click', () => {
      tabRegister.classList.add('active');
      tabLogin.classList.remove('active');
      formRegister.style.display = 'block';
      formLogin.style.display = 'none';
      alertBox.style.display = 'none';
    });

    // Handle Login
    formLogin.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const btn = document.getElementById('btn-login-submit');

      try {
        btn.disabled = true;
        btn.textContent = 'Verifying credentials...';
        await signInWithEmailAndPassword(auth, email, password);
        
        // Check if there was a saved redirect destination
        const redirectTarget = sessionStorage.getItem('redirectAfterLogin');
        sessionStorage.removeItem('redirectAfterLogin');
        if (redirectTarget) {
          window.location.href = redirectTarget;
        } else if (email.toLowerCase() === 'admin@medicare.com') {
          window.location.href = 'admin.html';
        } else {
          window.location.href = 'dashboard.html';
        }
      } catch (err) {
        let msg = 'Invalid email or password.';
        if (err.code === 'auth/user-not-found' || err.code === 'auth/invalid-credential') {
          msg = 'Account not found or password incorrect. Try registering if you are new.';
        } else if (err.code === 'auth/invalid-email') {
          msg = 'Please enter a valid email address.';
        }
        showAlert(msg, true);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign In to Patient Portal';
      }
    });

    // Handle Registration
    formRegister.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      const btn = document.getElementById('btn-register-submit');

      try {
        btn.disabled = true;
        btn.textContent = 'Creating account in Firebase...';
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        
        if (name) {
          await updateProfile(userCredential.user, { displayName: name });
        }

        // Save profile in Firestore users collection
        try {
          await setDoc(doc(db, 'users', userCredential.user.uid), {
            name: name,
            email: email,
            role: email.toLowerCase() === 'admin@medicare.com' ? 'admin' : 'patient',
            createdAt: new Date().toISOString()
          });
        } catch (dbErr) {
          console.warn('Firestore write warning:', dbErr);
        }

        const redirectTarget = sessionStorage.getItem('redirectAfterLogin');
        sessionStorage.removeItem('redirectAfterLogin');
        if (redirectTarget) {
          window.location.href = redirectTarget;
        } else {
          window.location.href = 'dashboard.html';
        }
      } catch (err) {
        let msg = 'Registration failed. ' + err.message;
        if (err.code === 'auth/email-already-in-use') {
          msg = 'This email is already registered. Please click "Sign In" instead.';
        } else if (err.code === 'auth/weak-password') {
          msg = 'Password should be at least 6 characters.';
        }
        showAlert(msg, true);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Create Free Account & Sign In';
      }
    });
  </script>
</body>
</html>
